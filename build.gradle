plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.neguentropia'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    generator {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    test {
        compileClasspath += sourceSets.generator.output + sourceSets.generator.compileClasspath
        runtimeClasspath += sourceSets.generator.output + sourceSets.generator.runtimeClasspath
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    generatorImplementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    generatorImplementation 'com.microsoft.onnxruntime:onnxruntime:1.31.1'
    generatorImplementation 'ai.djl.huggingface:tokenizers:0.39.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

tasks.register('generateGeminiEmbeddings', JavaExec) {
    classpath = sourceSets.generator.runtimeClasspath
    mainClass = 'com.neguentropia.similarity.GeminiEmbeddingGenerator'
}

tasks.register('generateLocalEmbeddings', JavaExec) {
    classpath = sourceSets.generator.runtimeClasspath
    mainClass = 'com.neguentropia.similarity.LocalEmbeddingGenerator'
}
